<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback | Happy Hunger</title><meta name="description" content="Share your Happy Hunger feedback. Feedback is stored only in this browser."><meta property="og:title" content="Feedback | Happy Hunger"><meta property="og:description" content="Share your Happy Hunger feedback. Feedback is stored only in this browser."><meta property="og:type" content="website"><meta property="og:image" content="./images/logo/happy-hunger.svg"><link rel="canonical" href="https://happyhunger.in/feedback.html"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><h1>Customer Feedback</h1><p class="lead">Your feedback helps shape the Happy Hunger experience.</p></div></section><section class="section"><div class="container detail"><form class="panel" id="fbForm"><div class="field"><label>Name<input name="name" required></label></div><div class="field"><label>Rating<select name="rating" required><option value="5">5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div><div class="field"><label>Dish<input name="dish"></label></div><div class="field"><label>Comments<textarea name="comments" required></textarea></label></div><button class="btn btn-primary">Save Feedback Locally</button><p><small>Stored only in this browser using localStorage.</small></p></form><div><div class="notice">Sample/demo testimonials below are for design preview only.</div><div class="testimonials" style="grid-template-columns:1fr;margin-top:15px"><div class="card card-body"><div class="stars">★★★★★</div><b>Demo Customer</b><p>“Warm, comforting food and a lovely homemade feel.”</p></div><div id="savedFeedback"></div></div></div></div></section></main><div data-footer></div><script src="./js/config.js"></script><script src="./js/menu-data.js"></script><script src="./js/recipe-data.js"></script><script src="./js/festival-data.js"></script><script src="./js/data.js"></script><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const draw=()=>{let a=JSON.parse(localStorage.getItem('hhFeedback')||'[]');savedFeedback.innerHTML=a.map(x=>`<div class="card card-body" style="margin-top:12px"><div class="stars">${'★'.repeat(+x.rating)}</div><b>${x.name}</b><p>${x.dish||''}</p><p>${x.comments}</p></div>`).join('')};fbForm.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));let a=JSON.parse(localStorage.getItem('hhFeedback')||'[]');a.unshift(x);localStorage.setItem('hhFeedback',JSON.stringify(a.slice(0,20)));e.target.reset();draw()};draw()})</script></body></html>
