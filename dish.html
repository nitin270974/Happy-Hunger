<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dish Details | Happy Hunger</title><meta name="description" content="View dish details, ingredients, portion, spice level and ordering options."><meta property="og:title" content="Dish Details | Happy Hunger"><meta property="og:description" content="View dish details, ingredients, portion, spice level and ordering options."><meta property="og:type" content="website"><meta property="og:image" content="./images/logo/happy-hunger.svg"><link rel="canonical" href="https://happyhunger.in/dish.html"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css"></head><body><div data-header></div><main><section class="section"><div class="container" id="dishDetail"></div></section></main><div data-footer></div><script src="./js/config.js"></script><script src="./js/menu-data.js"></script><script src="./js/recipe-data.js"></script><script src="./js/festival-data.js"></script><script src="./js/data.js"></script><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=new URLSearchParams(location.search).get('id')||'jowar-upma',d=(HH_MENU||[]).find(x=>x.id===id),e=document.querySelector('#dishDetail');if(!d){e.innerHTML='<p>Dish not found. <a href="./menu.html">Back to menu</a></p>';return}let rv=JSON.parse(localStorage.getItem('hhRecent')||'[]').filter(x=>x!==id);rv.unshift(id);localStorage.setItem('hhRecent',JSON.stringify(rv.slice(0,6)));e.innerHTML=`<div class="detail"><img src="${d.image}" alt="${d.name}"><div><span class="eyebrow">${d.category}</span><h1 class="section-title">${d.name}</h1><p class="lead">${d.desc}</p><div class="meta"><span class="badge green">${d.diet==='vegan'?'Vegan':'Vegetarian'}</span><span class="badge">${d.spice}</span><span class="badge">${d.portion}</span></div><h2>₹${d.price}</h2><p><b>Taste profile:</b> ${d.taste}</p><p><b>Preparation:</b> ${d.prep}</p><p><b>Serving suggestion:</b> ${d.serving}</p><p><b>Allergen information:</b> ${d.allergens}</p><h3>Ingredients</h3><ul>${d.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul><div class="actions"><button class="btn btn-primary" id="dishOrder">Enquire / Order</button><button class="btn btn-secondary" id="shareDish">Share Dish</button><button class="fav" data-fav="dish:${d.id}">♡</button></div></div></div>`;HH.initFav();document.querySelector('#dishOrder').onclick=()=>HH.orderModal(d.name);document.querySelector('#shareDish').onclick=()=>navigator.share?navigator.share({title:d.name,text:d.desc,url:location.href}):navigator.clipboard?.writeText(location.href)})</script></body></html>
