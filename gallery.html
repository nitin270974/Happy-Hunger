<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Hunger Gallery | Food & Kitchen</title><meta name="description" content="Explore the Happy Hunger food gallery and behind-the-scenes sample visuals."><meta property="og:title" content="Happy Hunger Gallery | Food & Kitchen"><meta property="og:description" content="Explore the Happy Hunger food gallery and behind-the-scenes sample visuals."><meta property="og:type" content="website"><meta property="og:image" content="./images/logo/happy-hunger.svg"><link rel="canonical" href="https://happyhunger.in/gallery.html"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><h1>Gallery</h1><p class="lead">Food, festive ideas and kitchen moments.</p></div></section><section class="section"><div class="container gallery"><figure><button class="gallery-open icon-btn" data-src="./images/gallery/gallery-1.svg"><img src="./images/gallery/gallery-1.svg" alt="Jowar Upma gallery image"></button><figcaption>Indian Food • Jowar Upma</figcaption></figure><figure><button class="gallery-open icon-btn" data-src="./images/gallery/gallery-2.svg"><img src="./images/gallery/gallery-2.svg" alt="Vegetable Poha gallery image"></button><figcaption>Snacks • Vegetable Poha</figcaption></figure><figure><button class="gallery-open icon-btn" data-src="./images/gallery/gallery-3.svg"><img src="./images/gallery/gallery-3.svg" alt="Paneer Tikka gallery image"></button><figcaption>Desserts • Paneer Tikka</figcaption></figure><figure><button class="gallery-open icon-btn" data-src="./images/gallery/gallery-4.svg"><img src="./images/gallery/gallery-4.svg" alt="Sweet Potato Chaat gallery image"></button><figcaption>Healthy Food • Sweet Potato Chaat</figcaption></figure><figure><button class="gallery-open icon-btn" data-src="./images/gallery/gallery-5.svg"><img src="./images/gallery/gallery-5.svg" alt="Vegetable Pulao gallery image"></button><figcaption>Festive Food • Vegetable Pulao</figcaption></figure><figure><button class="gallery-open icon-btn" data-src="./images/gallery/gallery-6.svg"><img src="./images/gallery/gallery-6.svg" alt="Coconut Modak gallery image"></button><figcaption>Kitchen • Coconut Modak</figcaption></figure></div></section></main><div class="modal lightbox" id="lightbox"><button class="icon-btn" id="lbClose">Close ✕</button><img id="lbImg" alt="Gallery preview"></div><div data-footer></div><script src="./js/config.js"></script><script src="./js/menu-data.js"></script><script src="./js/recipe-data.js"></script><script src="./js/festival-data.js"></script><script src="./js/data.js"></script><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.gallery-open').forEach(b=>b.onclick=()=>{lbImg.src=b.dataset.src;lightbox.classList.add('open')});lbClose.onclick=()=>lightbox.classList.remove('open')})</script></body></html>
