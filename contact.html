<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Happy Hunger | Phone, WhatsApp & Email</title><meta name="description" content="Contact Happy Hunger by phone, WhatsApp or email."><meta property="og:title" content="Contact Happy Hunger | Phone, WhatsApp & Email"><meta property="og:description" content="Contact Happy Hunger by phone, WhatsApp or email."><meta property="og:type" content="website"><meta property="og:image" content="./images/logo/happy-hunger.svg"><link rel="canonical" href="https://happyhunger.in/contact.html"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><h1>Contact Happy Hunger</h1><p class="lead">Questions, custom enquiries or a planned order? Reach us directly.</p></div></section><section class="section"><div class="container detail"><div class="panel" id="contactInfo"></div><form class="panel" id="contactForm"><div class="field"><label>Name<input name="name" required></label></div><div class="field"><label>Mobile<input name="mobile" required></label></div><div class="field"><label>Email<input name="email" type="email"></label></div><div class="field"><label>Subject<input name="subject" required></label></div><div class="field"><label>Message<textarea name="message" rows="5" required></textarea></label></div><button class="btn btn-primary">Send via WhatsApp</button><p><small>This static form opens WhatsApp. Nothing is stored in a database.</small></p></form></div></section></main><div data-footer></div><script src="./js/config.js"></script><script src="./js/menu-data.js"></script><script src="./js/recipe-data.js"></script><script src="./js/festival-data.js"></script><script src="./js/data.js"></script><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{contactInfo.innerHTML=`<h2>Get in touch</h2><p><b>Phone:</b> ${HH_CONFIG.phone}</p><p><b>WhatsApp:</b> ${HH_CONFIG.phone}</p><p><b>Email:</b> <a href="mailto:${HH_CONFIG.email}">${HH_CONFIG.email}</a></p><p><b>Location:</b> ${HH_CONFIG.area}, ${HH_CONFIG.city}</p><p><b>Opening hours:</b> ${HH_CONFIG.openingHours.start}–${HH_CONFIG.openingHours.end}</p>`;contactForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);HH.whatsapp(`Hello Happy Hunger,
Name: ${f.get('name')}
Mobile: ${f.get('mobile')}
Email: ${f.get('email')}
Subject: ${f.get('subject')}
Message: ${f.get('message')}`)}})</script></body></html>
