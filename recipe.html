<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Details | Happy Hunger</title><meta name="description" content="Step-by-step Happy Hunger recipe with ingredients, tips and approximate nutrition."><meta property="og:title" content="Recipe Details | Happy Hunger"><meta property="og:description" content="Step-by-step Happy Hunger recipe with ingredients, tips and approximate nutrition."><meta property="og:type" content="website"><meta property="og:image" content="./images/logo/happy-hunger.svg"><link rel="canonical" href="https://happyhunger.in/recipe.html"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css"></head><body><div data-header></div><main><section class="section"><div class="container" id="recipeDetail"></div></section></main><div data-footer></div><script src="./js/config.js"></script><script src="./js/menu-data.js"></script><script src="./js/recipe-data.js"></script><script src="./js/festival-data.js"></script><script src="./js/data.js"></script><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=new URLSearchParams(location.search).get('id')||'jowar-upma',r=(HH_RECIPES||[]).find(x=>x.id===id),e=document.querySelector('#recipeDetail');if(!r){e.innerHTML='<p>Recipe not found.</p>';return}e.innerHTML=`<div class="detail"><img src="${r.image}" alt="${r.name}"><div><span class="eyebrow">Happy Hunger Recipe</span><h1 class="section-title">${r.name}</h1><p class="lead">${r.desc}</p><div class="meta"><span class="badge">Prep ${r.prep}</span><span class="badge">Cook ${r.cook}</span><span class="badge">${r.servings} servings</span><span class="badge">${r.difficulty}</span></div><div class="actions"><button class="btn btn-primary" onclick="print()">Print Recipe</button><button class="fav" data-fav="recipe:${r.id}">♡</button></div></div></div><div class="detail section"><div class="panel"><h2>Ingredients</h2><ul>${r.ingredients.map(x=>`<li>${x.item} — ${x.qty}</li>`).join('')}</ul><h2>Tips</h2><ul>${r.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="panel"><h2>Method</h2><ol class="steps">${r.method.map(x=>`<li>${x}</li>`).join('')}</ol><h2>Nutrition <small>(approximate)</small></h2>${Object.entries(r.nutrition).map(([k,v])=>`<p><b>${k}:</b> ${v}</p>`).join('')}</div></div>`;HH.initFav()})</script></body></html>
